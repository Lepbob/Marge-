<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fa">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Marge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f8fa; --bg-soft:#eaeff4; --bg-hover:#dde5ee;
  --fg:#0f1b2a; --muted:#475a6e; --line:#d3dce6; --accent:#0b5fc4; --accent-soft:#dceafb; --on-accent:#ffffff; --amber:#ffb020;
  --hi:#c62828; --mid:#e39a00; --lo:#2e9e5b; --alert:#c62828; --tint:17%;
  --red-bg:#fbd3d5; --red-fg:#8a1c1a; --orange-bg:#fad8b5; --orange-fg:#80380a;
  --green-bg:#cfe7cc; --green-fg:#1a5427; --blue-bg:#cbe3f2; --blue-fg:#12527a;
  --purple-bg:#e7daf5; --purple-fg:#4a1f70; --gray-bg:#ece7f2; --gray-fg:#3f3650;
  --shadow:0 8px 30px rgba(36,26,51,.2);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#161c23; --bg-soft:#1d252e; --bg-hover:#27313c;
  --fg:#d8e0e9; --muted:#97a5b5; --line:#29333e; --accent:#7db4ee; --accent-soft:#1d3550; --on-accent:#0b1520; --amber:#e3a56a;
  --hi:#e87878; --mid:#e5b455; --lo:#6fbf92; --alert:#e87878; --tint:12%;
  --red-bg:#5a2a2c; --red-fg:#ffc9c9; --orange-bg:#5a3d1c; --orange-fg:#f5d3a8;
  --green-bg:#264a35; --green-fg:#bfe6d0; --blue-bg:#23435f; --blue-fg:#c4e0f8;
  --purple-bg:#38305a; --purple-fg:#ddd3f7; --gray-bg:#2e3844; --gray-fg:#cfd8e2;
  --shadow:0 8px 30px rgba(0,0,0,.6);
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161c23; --bg-soft:#1d252e; --bg-hover:#27313c;
  --fg:#d8e0e9; --muted:#97a5b5; --line:#29333e; --accent:#7db4ee; --accent-soft:#1d3550; --on-accent:#0b1520; --amber:#e3a56a;
  --hi:#e87878; --mid:#e5b455; --lo:#6fbf92; --alert:#e87878; --tint:12%;
  --red-bg:#5a2a2c; --red-fg:#ffc9c9; --orange-bg:#5a3d1c; --orange-fg:#f5d3a8;
  --green-bg:#264a35; --green-fg:#bfe6d0; --blue-bg:#23435f; --blue-fg:#c4e0f8;
  --purple-bg:#38305a; --purple-fg:#ddd3f7; --gray-bg:#2e3844; --gray-fg:#cfd8e2;
  --shadow:0 8px 30px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
.colordd summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:13.5px;list-style:none;padding:3px 5px;border-radius:6px}
.colordd summary::-webkit-details-marker{display:none}
.colordd summary:hover{background:var(--bg-hover);color:var(--fg)}
.colordd .pal{margin-top:8px}
.more{border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.more[open]{padding-bottom:12px}
.more summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600}
.more>.form{margin-top:10px}
.card-det{border-top:1px solid var(--line);padding-top:6px}
.card-det .props{margin-top:8px}
.card-det .actions{margin-top:8px}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* Sidebar */
.side{background:var(--bg-soft);border-right:1px solid var(--line);position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  padding:16px 10px 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand-mark{width:24px;height:24px;border-radius:5px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700}
.nav-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 8px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg-hover);color:var(--fg)}
.nav-item[aria-current="page"]{background:var(--bg-hover);color:var(--fg)}
.nav-item svg{flex:none}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px}
.google-btn{display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;color:var(--muted);font-weight:500;width:100%}
.google-btn[disabled]{cursor:not-allowed;opacity:.85}
.google-btn small{margin-left:auto;font-size:11px;font-family:var(--mono)}

/* Main */
.main{min-width:0;padding:44px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));}
.page.wide{max-width:1500px}
.page{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:24px;min-width:0}
.sample{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--blue-fg);border-radius:12px;padding:8px 12px;font-size:13px}
.sample button{border:0;background:none;text-decoration:underline;color:inherit;padding:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{margin:0;font-family:var(--display);font-size:34px;line-height:1.12;letter-spacing:-.025em;font-weight:800;text-wrap:balance;text-transform:none}
.page-head h1::first-letter{text-transform:uppercase}
.sub{color:var(--muted);margin:4px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 16px;font-weight:600;font-size:14px}
.btn:hover{background:var(--bg-hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{background:var(--accent);filter:brightness(.93)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:none;border-radius:5px;padding:4px;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--bg-hover);color:var(--fg)}

h2{font-family:var(--display);font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;color:var(--fg)}
h2 .count{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:6px;min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px;margin:0;padding:0;list-style:none}
.summary b{color:var(--fg);font-family:var(--mono);font-weight:500}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px}
.cols>.wide{grid-column:1/-1}

/* Tags */
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;line-height:1.5;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.t-red{background:var(--red-bg);color:var(--red-fg)} .t-orange{background:var(--orange-bg);color:var(--orange-fg)}
.t-green{background:var(--green-bg);color:var(--green-fg)} .t-blue{background:var(--blue-bg);color:var(--blue-fg)}
.t-purple{background:var(--purple-bg);color:var(--purple-fg)} .t-gray{background:var(--gray-bg);color:var(--gray-fg)}
.pill{font-family:var(--mono);font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}

/* Rows */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);border-radius:0}
.row:hover{background:var(--bg-soft)}
.row .main-cell{min-width:0}
.row .title{font-weight:500;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted);font-size:13px;margin-top:2px}
.row .side-cell{display:flex;align-items:center;gap:8px}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);background:none;display:grid;place-items:center;padding:0;color:transparent}
.check:hover{border-color:var(--accent)}
.row.done .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mono{font-family:var(--mono);font-size:12.5px}
.empty{color:var(--muted);padding:14px 4px;font-size:14px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 12px;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--bg-hover);color:var(--fg)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select.field,input.field,textarea.field{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 11px;min-width:0}
.statebtn{border:0;border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px}
.chip b{font-family:var(--mono);font-weight:500}

/* Timeline (today) */
.course{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);align-items:start}
.course .time{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.course.past{opacity:.62}
.course.next{background:var(--accent-soft);border-radius:6px;border-bottom-color:transparent}

/* Week */
.week{display:grid;grid-template-columns:var(--cols,repeat(var(--n,5),minmax(0,1fr)));gap:10px}
.day{display:flex;flex-direction:column;gap:6px;min-width:0}
.day-head{padding:2px 2px 6px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.day-head span{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:12px}
.day.today .day-head{border-bottom-color:var(--accent);color:var(--accent)}
.ev{position:relative;border-radius:12px;padding:7px 9px;font-size:13px;min-width:0;display:flex;flex-direction:column;gap:1px}
.ev b{font-weight:600;overflow-wrap:anywhere}
.ev .t{font-family:var(--mono);font-size:11.5px;opacity:.85}
.ev.flag{border:1.5px dashed var(--s);border-left:5px solid var(--s);background:color-mix(in srgb,var(--s) 16%,var(--bg));color:var(--fg)}
.ev.plan{border:1.5px dashed var(--s);background:color-mix(in srgb,var(--s) 12%,var(--bg));color:var(--fg)}
.evedit{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:8px;background:transparent;color:inherit;opacity:.55;display:grid;place-items:center;cursor:pointer;padding:0}
.evedit:hover,.evedit:focus-visible{opacity:1;background:rgba(0,0,0,.08)}
.ev .lk{margin-top:4px;padding:4px 7px;border-radius:8px;background:var(--bg);color:var(--fg);font-size:12px;border:1px solid var(--line)}
[hidden]{display:none!important}
.sctag{background:color-mix(in srgb,var(--s) 22%,var(--bg));color:color-mix(in srgb,var(--s) 40%,var(--fg));border:1px solid color-mix(in srgb,var(--s) 50%,transparent)}
.ev.sc{background:color-mix(in srgb,var(--s) 40%,var(--bg));color:var(--fg);border:1px solid color-mix(in srgb,var(--s) 75%,var(--bg));border-left:5px solid var(--s)}
.tlg{display:grid;grid-template-columns:40px var(--cols);gap:10px}
.tlg.heads{margin-bottom:6px}
.tlg.strips{align-items:start;margin-bottom:6px}
.tlg.strips .day{gap:4px}
.tlg.strips .ev{padding:3px 8px;font-size:12px;gap:0}
.tlg.strips .ev b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.25}
.axis{position:relative}
.axis span{position:absolute;right:2px;transform:translateY(-50%);font:400 11px var(--mono);color:var(--muted)}
.tl{position:relative;border-radius:10px}
.tl .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.7}
.tl .ev{position:absolute;overflow:hidden;margin:0;padding:4px 7px;font-size:12px;z-index:2;gap:0}
.tl .ev b{font-size:12.5px;line-height:1.25}
.tl .ev .t{font-size:11px}
.tl .ev.plan{z-index:3}
.tl .free{position:absolute;left:0;right:0;border-radius:8px;display:grid;place-items:center;font:500 11.5px var(--mono);color:var(--accent);background:repeating-linear-gradient(135deg,var(--accent-soft) 0 6px,transparent 6px 12px);border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent)}
.nowline{position:absolute;left:-4px;right:0;border-top:2px solid var(--alert);z-index:4}
.free-chip{border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:4px 9px;font:500 12px var(--mono);text-align:center}
.mob{display:none}
.rows:has(.row.hw){border-top:0;gap:8px}
.persolist{display:flex;flex-direction:column;gap:6px}
.setrow.chk{gap:8px;font-size:14px}
.echbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;text-decoration:none;color:var(--fg);padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg-hover)}
.echlab{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.echchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--s) 28%,var(--bg));border:1px solid color-mix(in srgb,var(--s) 60%,var(--bg));white-space:nowrap}
.echchip i{width:7px;height:7px;border-radius:50%;background:var(--s)}
.echchip.late{border-color:var(--alert)}
.plbar{margin-bottom:10px}
.wk{font:400 11.5px var(--mono);color:var(--muted);margin-left:4px;font-weight:400}
.tl .ev.sc{cursor:pointer}
.tl .ev.sc.open{opacity:1;height:auto!important;overflow:visible;z-index:6;box-shadow:var(--shadow);background:linear-gradient(color-mix(in srgb,var(--s) 28%,transparent),color-mix(in srgb,var(--s) 28%,transparent)),var(--bg)}
.echchip u{width:7px;height:7px;border-radius:50%;background:var(--s);display:inline-block;flex:none}
.echchip.strong{background:color-mix(in srgb,var(--s) 36%,var(--bg))}
.plbar .echchip{white-space:normal}
.tl .ghost{position:absolute;left:0;right:0;border:1px dotted color-mix(in srgb,var(--muted) 60%,transparent);border-radius:8px;font:10.5px var(--mono);color:var(--muted);padding:2px 6px;z-index:1;pointer-events:none;overflow:hidden;line-height:1.2}
.ghostchip{font:11.5px var(--mono);color:var(--muted);border:1px dotted color-mix(in srgb,var(--muted) 60%,transparent);border-radius:8px;padding:4px 8px}
.echmore{font-size:12.5px;color:var(--muted);font-weight:600}
.echwrap{display:flex;flex-direction:column;gap:6px}
.lkdv{display:flex;flex-direction:column;gap:5px;margin-left:18px;padding-left:10px;border-left:2px solid var(--line)}
.lkrow{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 6px 4px 0;position:relative}
.lkrow .band{width:4px;align-self:stretch;border-radius:3px;background:var(--p);flex:none}
.lkrow .lt{flex:1;min-width:0;overflow-wrap:anywhere}
.lkrow.done .lt{text-decoration:line-through;opacity:.6}
.ev.sc.perso{background:color-mix(in srgb,var(--muted) 14%,var(--bg));border:1px dashed color-mix(in srgb,var(--muted) 55%,var(--bg));border-left:5px solid var(--muted)}
.row.hw{grid-template-columns:5px auto minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px 10px 0;border:1px solid color-mix(in srgb,var(--s) 42%,var(--bg));border-radius:14px;background:color-mix(in srgb,var(--s) var(--tint),var(--bg));overflow:hidden}
.row.hw:hover{background:color-mix(in srgb,var(--s) calc(var(--tint) + 5%),var(--bg))}
.row.hw .band{align-self:stretch;width:5px;margin:-10px 0;background:var(--p)}
.row.hw.done{opacity:.6}
.grp-h{display:flex;align-items:center;gap:8px}
.grp-h i{width:10px;height:10px;border-radius:3px;flex:none}
.grp-h em{font-style:normal;margin-left:auto}
.row.hw .sn{font-weight:700;color:color-mix(in srgb,var(--s) 55%,var(--fg))}
.row.hw .meta{color:var(--fg)}
.row.hw .check{border-color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:6px;height:14px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.sec-label{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.seg.wide{display:flex}.seg.wide button{flex:1}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.swatch{width:24px;height:24px;border-radius:50%;border:0;padding:0;cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.swatch.add{display:grid;place-items:center;border:1.5px dashed var(--muted);background:none;position:relative;color:var(--muted);font-weight:700;overflow:hidden}
.swatch.add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px}
.step.done span:first-of-type{text-decoration:line-through;opacity:.6}
.stepchk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);background:none;color:transparent;display:inline-grid;place-items:center;padding:0;cursor:pointer;flex:none}
.step.done .stepchk{background:var(--accent);border-color:var(--accent);color:#fff}
.step-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px dashed var(--muted);border-radius:12px;margin-bottom:8px}
.step-row .three{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:8px}
.load{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 2px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ev.past{opacity:.62}
.weeknav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Subjects */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.subj{background:color-mix(in srgb,var(--s) calc(var(--tint) + 6%),var(--bg));border:1px solid color-mix(in srgb,var(--s) 50%,var(--bg));border-left:5px solid var(--s)}
.card.subj .props input:hover,.card.subj .props input:focus{background:color-mix(in srgb,var(--s) 15%,var(--bg))}
.card h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.props{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 8px;align-items:center;font-size:13.5px}
.props label{color:var(--muted)}
.props input{border:0;background:none;padding:3px 5px;border-radius:4px;width:100%;min-width:0}
.props input:hover,.props input:focus{background:var(--bg-hover)}
.card .actions{display:flex;flex-wrap:wrap;gap:6px}
.card .stats{display:flex;gap:6px;flex-wrap:wrap}
a.btn{text-decoration:none}
a.google-btn,a.icon-btn{text-decoration:none}
.sub a{color:var(--accent);font-weight:600}
.linkbtn{border:0;background:none;text-decoration:underline;padding:0;color:var(--accent);font-weight:600}
.panel{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.who b{overflow-wrap:anywhere}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.setrow label{color:var(--muted);font-size:13.5px}
.setrow select{min-width:0;max-width:100%}
.err{color:var(--red-fg);background:var(--red-bg);border-radius:6px;padding:8px 10px;font-size:13.5px;overflow-wrap:anywhere}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--bg);border-radius:16px;box-shadow:var(--shadow);width:min(480px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h2{font-size:17px}
.modal-head{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.modal-head:active{cursor:grabbing}
.form{display:flex;flex-direction:column;gap:11px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.form .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .field{width:100%;color:var(--fg)}
.form-actions{display:flex;justify-content:flex-end;gap:8px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* Mobile bar */
.topbar,.tabbar,.fab{display:none}
@media (max-width:859px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-top:16px;padding-bottom:110px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin:0 auto 16px;max-width:860px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px 0;border-radius:6px;font-weight:500}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;
    border:0;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);z-index:21}
  .page-head h1{font-size:26px}
  .head-add{display:none}
  .head-add.always{display:inline-flex}
  .cols{grid-template-columns:minmax(0,1fr)}
  .week{grid-template-columns:minmax(0,1fr)}
  .day.emptywk{display:none}
  .desk{display:none}
  .mob{display:flex;flex-direction:column;gap:12px}
  .mob .day{gap:6px}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row .side-cell{grid-column:2;flex-wrap:wrap}
  .row.hw{grid-template-columns:5px auto minmax(0,1fr)}
  .row.hw .band{grid-row:1 / span 2}
  .row.hw .side-cell{grid-column:3}
  .course{grid-template-columns:84px minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav-item,.row{transition:background .12s}}

<script>
(function(){
  var KEY='hubfac-v1', THEME_KEY='hubfac-theme';
  var DAYS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
  var PALETTE=['#e07a1f','#e5484d','#d6336c','#ab47bc','#7b4fd0','#4f5bd5','#2f7fe0','#0e9aa7','#1fa06a','#6baa2a','#c9a800','#f0a020','#8d6e63','#607d8b','#37474f'];
  var COLORS=PALETTE,NAMEHEX={blue:'#2f7fe0',purple:'#7b4fd0',green:'#1fa06a',orange:'#e07a1f',red:'#e5484d',gray:'#607d8b'};
  function hexOf(c){
    var h=/^#[0-9a-f]{6}$/i.test(c||'')?c:(NAMEHEX[c]||NAMEHEX.gray);
    if(!isDark())return h;
    var m=[1,3,5].map(function(i,k){return Math.round(parseInt(h.substr(i,2),16)*.7+[200,208,218][k]*.3)});
    return '#'+m.map(function(v){return (v<16?'0':'')+v.toString(16)}).join('');
  }
  var STATES=[{k:'todo',l:'À rattraper',c:'red'},{k:'doing',l:'En cours',c:'orange'},{k:'done',l:'Rattrapé',c:'green'}];
  var PRIO={high:{l:'Difficile',v:'var(--hi)'},mid:{l:'Moyen',v:'var(--mid)'},low:{l:'Facile',v:'var(--lo)'}};
  var REMIND={eve:'La veille',d3:'3 jours avant',same:'Le matin même',none:'Aucun rappel'};

  function pad(n){return (n<10?'0':'')+n}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function parse(dateIso,time){var p=dateIso.split('-'),t=(time||'00:00').split(':');return new Date(+p[0],+p[1]-1,+p[2],+t[0],+t[1])}
  function startOfDay(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
  function dayDiff(d){return Math.round((startOfDay(d)-startOfDay(new Date()))/864e5)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function uid(){return Math.random().toString(36).slice(2,9)}
  var fmtDay=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  var fmtLong=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  var fmtShort=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'});

  var ICONS={
    home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    flag:'<path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/>',
    book:'<path d="M4 4h11a3 3 0 013 3v13H7a3 3 0 01-3-3z"/><path d="M4 17a3 3 0 013-3h11"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    absent:'<circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0112 0v1"/><path d="M17 9l5 5M22 9l-5 5"/>',
    cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    moon:'<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
    tick:'<path d="M5 12l5 5 9-10"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3 1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8 1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    refresh:'<path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
    left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',
    g:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>'
  };
  function logo(n){return '<svg width="'+n+'" height="'+n+'" viewBox="0 0 100 100" role="img" aria-label="Marge" style="flex:none"><rect x="2" y="2" width="96" height="96" rx="24" fill="#1b232c" stroke="#2c3743" stroke-width="1.5"/><path d="M26 18V82" stroke="#e58e8e" stroke-width="4.5" stroke-linecap="round"/><path d="M37 33L43 39L53 26" stroke="#6fcba0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M60 33H78" stroke="#7db4ee" stroke-width="6" stroke-linecap="round"/><circle cx="42" cy="52" r="5" stroke="#d8e0e9" stroke-width="3.5" fill="none" opacity=".75"/><path d="M56 52H76" stroke="#d8e0e9" stroke-width="6" stroke-linecap="round" opacity=".8"/><circle cx="42" cy="70" r="5" stroke="#d8e0e9" stroke-width="3.5" fill="none" opacity=".5"/><path d="M56 70H72" stroke="#d8e0e9" stroke-width="6" stroke-linecap="round" opacity=".55"/></svg>'}
  function icon(n,s){s=s||18;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>'}

  /* ---------- Données d'exemple ---------- */
  function seed(){
    var t=new Date();
    function d(n){return iso(addDays(t,n))}
    var subs=[
      {id:'s1',name:'Droit constitutionnel',color:'purple',prof:'Mme Lambert',room:'Amphi B',coef:4,drive:''},
      {id:'s2',name:'Microéconomie',color:'blue',prof:'M. Roussel',room:'Amphi A',coef:3,drive:''},
      {id:'s3',name:'Statistiques',color:'green',prof:'Mme Okafor',room:'Salle 204',coef:3,drive:''},
      {id:'s4',name:'Anglais',color:'orange',prof:'M. Whitaker',room:'Salle 112',coef:2,drive:''},
      {id:'s5',name:'Histoire contemporaine',color:'red',prof:'M. Delmas',room:'Amphi C',coef:2,drive:''}
    ];
    var hw=[
      {id:uid(),title:'Fiche de lecture : décision du Conseil constitutionnel',sub:'s1',date:d(1),time:'18:00',prio:'high',remind:'eve',done:false},
      {id:uid(),title:'Exercices du TD 4',sub:'s3',date:d(2),time:'23:59',prio:'mid',remind:'eve',done:false},
      {id:uid(),title:'Essay « Climate and media » (500 mots)',sub:'s4',date:d(3),time:'12:00',prio:'mid',remind:'d3',done:false},
      {id:uid(),title:'Dissertation sur le marché du travail',sub:'s2',date:d(6),time:'23:59',prio:'high',remind:'d3',done:false},
      {id:uid(),title:'Commentaire de document sur 1945',sub:'s5',date:d(9),time:'23:59',prio:'low',remind:'same',done:false},
      {id:uid(),title:'QCM de révision en ligne',sub:'s3',date:d(-1),time:'23:59',prio:'mid',remind:'eve',done:false},
      {id:uid(),title:'Résumé du chapitre 3',sub:'s2',date:d(-3),time:'23:59',prio:'low',remind:'none',done:true}
    ];
    hw.forEach(function(h){h.demo=true});
    var abs=[
      {id:uid(),sub:'s2',date:d(-7),what:'Diapos du chapitre 2 et notes du cours',who:'Léa',state:'todo'},
      {id:uid(),sub:'s5',date:d(-4),what:'Sujet du commentaire de document',who:'Hugo',state:'doing'},
      {id:uid(),sub:'s4',date:d(-14),what:'Feuille d\'exercices sur les temps du passé',who:'Camille',state:'done'}
    ];
    return {subjects:subs,homework:hw,absences:abs,sample:true,settings:{schoolCal:'',map:{},ignored:[],imported:''},pendingDeletes:[],updatedAt:0};
  }
  var state=load()||seed();
  state=normalize(state);
  function normalize(st){
    st.settings=st.settings||{};st.settings.schoolCal=st.settings.schoolCal||'';st.settings.map=st.settings.map||{};
    st.settings.ignored=st.settings.ignored||[];st.settings.imported=st.settings.imported||'';
    st.pendingDeletes=st.pendingDeletes||[];st.updatedAt=st.updatedAt||0;st.evOver=st.evOver||{};st.customEvents=st.customEvents||[];
    if(st.sample&&!st.demoMarked){
      [st.homework,st.absences,st.subjects].forEach(function(l){(l||[]).forEach(function(x){if(x.demo===undefined)x.demo=true})});
      st.demoMarked=true;
    }
    return st;
  }
  function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
  function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  function save(){state.updatedAt=Date.now();persistLocal();cloudPush()}
  function afterChange(){save();calSync()}

  var SCHEDULE=[
    [{s:'s1',a:'08:30',b:'10:30',k:'CM',r:'Amphi B'},{s:'s3',a:'14:00',b:'16:00',k:'TD',r:'Salle 204'}],
    [{s:'s2',a:'10:30',b:'12:30',k:'CM',r:'Amphi A'},{s:'s4',a:'14:00',b:'15:30',k:'TD',r:'Salle 112'}],
    [{s:'s5',a:'08:30',b:'10:30',k:'CM',r:'Amphi C'},{s:'s1',a:'13:30',b:'15:30',k:'TD',r:'Salle 305'}],
    [{s:'s3',a:'09:00',b:'11:00',k:'CM',r:'Amphi A'},{s:'s2',a:'15:45',b:'17:15',k:'TD',r:'Salle 210'}],
    [{s:'s4',a:'10:00',b:'11:30',k:'TD',r:'Salle 112'},{s:'s5',a:'14:00',b:'16:00',k:'TD',r:'Salle 301'}]
  ];

  function sub(id){for(var i=0;i<state.subjects.length;i++)if(state.subjects[i].id===id)return state.subjects[i];return {name:'Sans matière',color:'gray',id:''}}
  function subTag(id){var s=sub(id);return '<span class="tag sctag" style="--s:'+hexOf(s.color)+'">'+esc(s.name)+'</span>'}

  /* ---------- Échéances ---------- */
  function planDay(h){
    if(h.steps&&h.steps.length){var ds=h.steps.filter(function(x){return !x.done&&x.planDate}).map(function(x){return x.planDate}).sort();return ds[0]||''}
    return h.planDate||'';
  }
  function countdown(h){
    if(h.done)return {label:'Fini',cls:'t-green',late:false,days:99};
    if(!h.date)return {label:'',cls:'',late:false,days:999};
    var due=parse(h.date,h.time||'23:59'),dd=dayDiff(due),late=due<new Date();
    if(late)return {label:dd<0?'En retard · '+(-dd)+' j':'En retard',cls:'t-red',late:true,days:dd};
    var label;
    if(dd===0){var hrs=Math.floor((due-new Date())/36e5);label=hrs>=1?'Dans '+hrs+' h':'Dans '+Math.max(1,Math.round((due-new Date())/6e4))+' min'}
    else if(dd===1)label='Demain';
    else label='J-'+dd;
    return {label:label,cls:dd<=1?'t-red':dd<=4?'t-orange':'t-green',late:false,days:dd};
  }
  function sortedHw(list){
    return list.slice().sort(function(a,b){
      if(a.done!==b.done)return a.done?1:-1;
      if(!a.date!==!b.date)return a.date?-1:1;
      if(!a.date)return (planDay(a)||'9')<(planDay(b)||'9')?-1:1;
      return parse(a.date,a.time||'23:59')-parse(b.date,b.time||'23:59');
    });
  }
  var KINDS=[['devoir','Devoir'],['rendu','À rendre'],['cc','Contrôle continu'],['exam','Examen']];
  var KIND_TAG={rendu:['À rendre','blue'],cc:['Contrôle continu','orange'],exam:['Examen','red']};
  var KIND_FLAG={devoir:'Devoir',rendu:'À rendre',cc:'Contrôle continu',exam:'Examen'};
  var KIND_SUM={devoir:'Devoir',rendu:'À rendre',cc:'Contrôle continu',exam:'Examen'};
  var DURS=[[0,'Non précisée'],[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h'],[180,'3 h'],[240,'4 h'],[360,'6 h']];
  function fmtDur(m){m=+m||0;if(m<60)return m+' min';return Math.floor(m/60)+' h'+(m%60?' '+pad(m%60):'')}
  function optList(list,sel){return list.map(function(o){return '<option value="'+o[0]+'"'+(String(o[0])===String(sel)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')}
  var STOPW={de:1,du:1,des:1,la:1,le:1,les:1,et:1,d:1,l:1,en:1,au:1,aux:1,a:1,un:1,une:1};
  function autoCode(name){var w=normKey(name).split(' ').filter(function(x){return x&&!STOPW[x]});return (w.length>1?w[1]:(w[0]||'')).slice(0,3)}
  function subCode(x){var c=normKey(x&&x.code).replace(/ /g,'').slice(0,3);return c||autoCode(x&&x.name)}
  function courseCode(e,di){
    if(e.noCode)return '';
    var u=e.sid?state.subjects.filter(function(x){return x.id===e.sid})[0]:null;
    if(!u&&e.title)u=state.subjects.filter(function(x){return x.name===e.title})[0];
    var c=u?subCode(u):'';if(c.length<3)return '';
    return (e.kind==='TD'?'T':'C')+c+di.slice(8,10)+di.slice(5,7);
  }
  function slotKey(e,di){return (!e.sid||e.noCode)?'':e.sid+'|'+di+'|'+e.a}
  function isLinked(h,e,di){
    if(!h.link)return false;
    var k=slotKey(e,di);if(!k)return false;
    return h.link===k||h.link.toLowerCase()===courseCode(e,di).toLowerCase();
  }
  function workItems(h){
    if(h.steps&&h.steps.length)return h.steps.map(function(s){return {h:h,sid:s.id,title:s.title,dur:+s.dur||0,planDate:s.planDate,planTime:s.planTime,done:h.done||s.done}});
    return [{h:h,sid:'',title:h.title,dur:+h.dur||0,planDate:h.planDate,planTime:h.planTime,done:h.done}];
  }
  function plannedOn(di){
    var out=[];state.homework.forEach(function(h){workItems(h).forEach(function(it){if(!it.done&&it.planDate===di)out.push(it)})});
    return out.sort(function(a,b){return (a.planTime||'99')<(b.planTime||'99')?-1:1});
  }
  function totDur(h){return (h.steps&&h.steps.length)?h.steps.reduce(function(t,x){return t+(+x.dur||0)},0):(+h.dur||0)}
  function planRow(it){
    var h=it.h,isStep=!!it.sid;
    return '<div class="row"><button class="check" data-act="'+(isStep?'toggle-step':'toggle-hw')+'" data-id="'+h.id+'"'+(isStep?' data-v="'+it.sid+'"':'')+' aria-label="Marquer fait">'+icon('tick',12)+'</button>'+
      '<div class="main-cell"><div class="title">'+esc(it.title)+(isStep?' <span class="mono">· '+esc(h.title)+'</span>':'')+'</div>'+
      '<div class="meta">'+subTag(h.sub)+(it.planTime?'<span class="mono">'+esc(it.planTime)+'</span>':'')+(it.dur?'<span>Durée visée : '+fmtDur(it.dur)+'</span>':'')+'</div></div></div>';
  }
  function isEch(h){return h.kind==='cc'||h.kind==='exam'}
  function dm(d){return d?d.slice(8,10)+'/'+d.slice(5,7):''}
  var KIND_SHORT={cc:'CC',exam:'Examen'};
  function echOf(h){return h.ech?state.homework.filter(function(x){return x.id===h.ech&&isEch(x)})[0]||null:null}

      return x.length>2&&!/^(salle|amphi|bat|bât|groupe|grp)/i.test(x)&&!/^\d/.test(x);

  function calSync(){
    if(syncing||!cloud.user||!tokenOk())return Promise.resolve();
    syncing=true;cloud.calError='';
    var changed=false,chain=Promise.resolve();
    state.pendingDeletes.slice().forEach(function(id){
      chain=chain.then(function(){
        var isT=id.indexOf('task:')===0;
        var call=isT?tapi('/lists/@default/tasks/'+encodeURIComponent(id.slice(5)),'DELETE'):gapi('/calendars/primary/events/'+encodeURIComponent(id),'DELETE');
        return call.catch(function(e){if(e.status!==404&&e.status!==410)throw e}).then(function(){
          state.pendingDeletes=state.pendingDeletes.filter(function(x){return x!==id});changed=true;
        }).catch(function(e){if(isT&&e.tasks){cloud.calError=friendly(e);return}throw e});
      });
    });
    var planSync=function(h){
      var steps=h.steps&&h.steps.length,objs=steps?h.steps.map(function(x){return {o:x,it:{h:h,sid:x.id,title:x.title,dur:+x.dur||0,planDate:x.planDate,planTime:x.planTime,done:h.done||x.done}}}):[{o:h,it:{h:h,sid:'',title:h.title,dur:+h.dur||0,planDate:h.planDate,planTime:h.planTime,done:h.done}}];
      var c2=Promise.resolve();
      if(steps&&h.planEv){var old=h.planEv;c2=c2.then(function(){return gapi('/calendars/primary/events/'+encodeURIComponent(old),'DELETE').catch(function(e){if(e.status!==404&&e.status!==410)throw e}).then(function(){h.planEv='';h.planSig='';changed=true})})}
      objs.forEach(function(q){c2=c2.then(function(){
        var o=q.o,it=q.it,valid=!h.demo&&!it.done&&it.planDate&&it.planTime,url='/calendars/primary/events/';
        if(o.planEv&&!valid){var id=o.planEv;return gapi(url+encodeURIComponent(id),'DELETE').catch(function(e){if(e.status!==404&&e.status!==410)throw e}).then(function(){o.planEv='';o.planSig='';changed=true})}
        if(!valid)return;
        if(o.planEv){
          if(o.planSig===planSig(it))return;
          return gapi(url+encodeURIComponent(o.planEv),'PATCH',planEvBody(it)).then(function(){o.planSig=planSig(it);changed=true}).catch(function(e){if(e.status===404||e.status===410){o.planEv='';o.planSig='';changed=true}else throw e});
        }
        if(parse(it.planDate,it.planTime)<=new Date())return;
        return gapi(url,'POST',planEvBody(it)).then(function(j){o.planEv=j.id;o.planSig=planSig(it);changed=true});
      })});
      return c2;
    };
    state.homework.forEach(function(h){
      chain=chain.then(function(){return planSync(h)});
      chain=chain.then(function(){
        if(h.done&&h.eventId){
          var id=h.eventId;
          return gapi('/calendars/primary/events/'+encodeURIComponent(id),'DELETE').catch(function(e){if(e.status!==404&&e.status!==410)throw e}).then(function(){h.eventId='';changed=true});
        }
        if(h.done&&h.taskId){
          var tid=h.taskId;
          return tapi('/lists/@default/tasks/'+encodeURIComponent(tid),'DELETE').catch(function(e){if(e.status!==404&&e.status!==410)throw e}).then(function(){h.taskId='';changed=true}).catch(function(e){if(e.tasks){cloud.calError=friendly(e);return}throw e});
        }
        if(needsTask(h)){
          return tapi('/lists/@default/tasks','POST',{
            title:(KIND_SUM[h.kind||'devoir'])+' : '+h.title+' ('+sub(h.sub).name+')'+(h.date?' · pour le '+fmtShort.format(parse(h.date))+(h.time&&h.time!=='23:59'?' à '+h.time:''):''),
            notes:'Ajouté depuis Marge',
            due:taskDue(h)
          }).then(function(j){h.taskId=j.id;changed=true}).catch(function(e){if(e.tasks){cloud.calError=friendly(e);return}throw e});
        }
        if(needsEvent(h)){
          var due=dueOf(h),mins=[remindMinutes(h,due)];
          if(mins.indexOf(60)<0)mins.push(60);
          return gapi('/calendars/primary/events','POST',{
            summary:(KIND_SUM[h.kind||'devoir'])+' : '+h.title+' ('+sub(h.sub).name+')',
            description:'Ajouté depuis Marge',
            start:{dateTime:due.toISOString()},
            end:{dateTime:new Date(due.getTime()+15*6e4).toISOString()},
            reminders:{useDefault:false,overrides:mins.map(function(m){return {method:'popup',minutes:m}})}
          }).then(function(j){h.eventId=j.id;changed=true});
        }
      });
    });
    return chain.catch(function(e){cloud.calError=friendly(e)}).then(function(){
      syncing=false;if(changed)save();softRender();
    });
  }

        if(evState.isNew){
          var until=g('e-until'),d=parse(date),n=0;
          do{state.customEvents.push({id:uid(),date:iso(d),a:a,b:b,title:title,sub:subv,kind:kind,room:room});d=addDays(d,7);n++}while(until&&iso(d)<=until&&n<60);
        }else{
          state.customEvents.forEach(function(c){if(c.id===evState.id){c.date=date;c.a=a;c.b=b;c.title=title;c.sub=subv;c.kind=kind;c.room=room}});
        }
      }else{
        if(title===evState.title||(u&&title===u.name))title='';
        state.evOver[evState.id]={title:title,sub:subv,kind:kind,room:room};
      }
      save();closeModal();render();return;
    }
    if(e.target.id!=='add-form')return;
    e.preventDefault();
    var v=function(id){var el=document.getElementById(id);return el?el.value.trim():''};
    if(modalMode==='hw'){
      var W={when:v('f-when')||'date',date:'',time:'',link:'',ctype:'CM',remind:v('f-remind')};
      if(W.when==='date'){W.date=v('f-date');W.time=v('f-time')||'23:59'}
      else if(W.when==='course'){
        var so=document.getElementById('f-slot'),op=so&&so.selectedOptions[0];
        if(!op||!op.getAttribute('data-date')){alert('Choisis un cours dans la liste.');return}
        W.date=op.getAttribute('data-date');W.time=op.getAttribute('data-a')||'23:59';W.link=op.getAttribute('data-code')||'';W.ctype=op.getAttribute('data-kind')==='TD'?'TD':'CM';
      }else W.remind='none';
      var data={title:v('f-title'),sub:v('f-sub'),kind:v('f-kind')||'devoir',date:W.date,time:W.time,prio:v('f-prio'),remind:W.remind,when:W.when,dur:+v('f-dur')||0,planDate:v('f-pdate'),planTime:v('f-pdate')?v('f-ptime'):'',ctype:W.ctype,asEvent:v('f-gmode')==='event'&&!!W.date,link:W.link};
      data.ech=(data.kind==='cc'||data.kind==='exam')?'':v('f-ech');
      var old=editId?state.homework.filter(function(x){return x.id===editId})[0]:null,oldSteps=(old&&old.steps)||[];
      data.steps=[].slice.call(document.querySelectorAll('#f-steps .step-row')).map(function(r){
        var t=r.querySelector('.s-title').value.trim();if(!t)return null;
        var sid=r.getAttribute('data-sid')||uid(),prev=oldSteps.filter(function(o){return o.id===sid})[0],pd=r.querySelector('.s-pdate').value;
        return {id:sid,title:t,dur:+r.querySelector('.s-dur').value||0,planDate:pd,planTime:pd?r.querySelector('.s-ptime').value:'',done:!!(prev&&prev.done),planEv:(prev&&prev.planEv)||'',planSig:(prev&&prev.planSig)||''};
      }).filter(Boolean);
      oldSteps.forEach(function(o){if(o.planEv&&!data.steps.some(function(x){return x.id===o.id}))state.pendingDeletes.push(o.planEv)});
      if(data.steps.length&&data.steps.every(function(x){return x.done}))data.done=true;
      var cur=editId?state.homework.filter(function(x){return x.id===editId})[0]:null;
      if(cur){
        var changed=['title','sub','kind','date','time','remind'].some(function(k){return cur[k]!==data[k]})||(!!cur.asEvent!==!!data.asEvent);
        if(changed){queueDel(cur);cur.eventId='';cur.taskId=''}
        Object.keys(data).forEach(function(k){cur[k]=data[k]});
      }else{
        data.id=uid();data.done=false;state.homework.push(data);
      }
    }else{
      state.absences.push({id:uid(),sub:v('f-sub'),date:v('f-date'),what:v('f-what'),who:v('f-who'),state:'todo'});
    }
    afterChange();closeModal();render();
  });

  /* ---------- Événements ---------- */
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]');if(!el)return;
    var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),val=el.getAttribute('data-v');
    if(act==='add')openModal();
    else if(act==='exp-ev'){var kk=el.getAttribute('data-key');openEv[kk]=!openEv[kk];render()}
    else if(act==='add-ech'){window.__pk='cc';openModal('hw');window.__pk=''}
    else if(act==='add-ev')openEvModal('',iso(new Date()));
    else if(act==='edit-ev')openEvModal(el.getAttribute('data-evid'),el.getAttribute('data-date'));
    else if(act==='ev-del'){
      if(evState.custom)state.customEvents=state.customEvents.filter(function(c){return c.id!==evState.id});
      else state.evOver[evState.id]={hide:true};
      save();closeModal();render();
    }
    else if(act==='ev-reset'){delete state.evOver[evState.id];save();closeModal();render()}
    else if(act==='ev-restore'){Object.keys(state.evOver).forEach(function(k){if(state.evOver[k].hide)delete state.evOver[k]});save();render()}
    else if(act==='close')closeModal();
    else if(act==='mode')openModal(val);
    else if(act==='edit-hw')openModal('hw',id);
    else if(act==='theme')toggleTheme();
    else if(act==='toggle-hw'){state.homework.forEach(function(h){if(h.id===id){h.done=!h.done;(h.steps||[]).forEach(function(x){x.done=h.done})}});afterChange();render()}
    else if(act==='toggle-step'){state.homework.forEach(function(h){if(h.id===id){(h.steps||[]).forEach(function(x){if(x.id===val)x.done=!x.done});h.done=!!(h.steps&&h.steps.length&&h.steps.every(function(x){return x.done}))}});afterChange();render()}
    else if(act==='add-step'){var box=document.getElementById('f-steps');if(box){box.insertAdjacentHTML('beforeend',stepRow());var ins=box.querySelectorAll('.s-title');ins[ins.length-1].focus()}}
    else if(act==='filter-sub'){hwSub=id;if(location.hash==='#devoirs')render()}
    else if(act==='sub-color'){state.subjects.forEach(function(x){if(x.id===id)x.color=val});save();render()}
    else if(act==='when'){
      var f=document.getElementById('f-when');if(f)f.value=val;
      [].forEach.call(el.parentNode.children,function(b){b.setAttribute('aria-pressed',String(b===el))});
      ['date','course','none'].forEach(function(k){var n=document.getElementById('w-'+k);if(n)n.hidden=(k!==val)});
      var wr=document.getElementById('w-remind');if(wr)wr.hidden=(val==='none');
      var fd=document.getElementById('f-date');if(fd)fd.required=(val==='date');
      var fs=document.getElementById('f-slot');if(fs)fs.required=(val==='course');
      if(val==='course'){fetchSlots();refreshSlotSelect()}
    }
    else if(act==='del-step'){var row=el.closest('.step-row');if(row)row.remove()}
    else if(act==='del-hw'){
      state.homework.forEach(function(h){if(h.id===id)queueDel(h,true)});
      state.homework.forEach(function(h){if(h.ech===id)h.ech=''});
      state.homework=state.homework.filter(function(h){return h.id!==id});afterChange();render();
    }
    else if(act==='cycle-abs'){
      state.absences.forEach(function(a){if(a.id===id){var i=STATES.map(function(s){return s.k}).indexOf(a.state);a.state=STATES[(i+1)%STATES.length].k}});
      save();render();
    }
    else if(act==='del-abs'){state.absences=state.absences.filter(function(a){return a.id!==id});save();render()}
    else if(act==='hw-filter'){hwFilter=val;render()}
    else if(act==='week'){weekOffset=val==='0'?0:weekOffset+(+val);render()}
    else if(act==='clear-sample'){
      state.homework.forEach(function(h){queueDel(h,true)});
      state.homework=[];state.absences=[];state.sample=false;afterChange();render();
    }
    else if(act==='add-sub'){
      var nid=uid();
      state.subjects.push({id:nid,name:'Nouvelle matière',color:PALETTE[state.subjects.length%PALETTE.length],prof:'',room:'',coef:'',drive:''});
      save();render();
      var inp=document.getElementById('p-'+nid+'-name');if(inp){inp.focus();inp.select()}
    }
    else if(act==='del-sub'){
      if(armedSub===id){
        var st=state.settings,gone=state.subjects.filter(function(x){return x.id===id})[0];
        Object.keys(st.map).forEach(function(k){if(st.map[k]===id){delete st.map[k];if(st.ignored.indexOf(k)<0)st.ignored.push(k)}});
        if(gone){var nk=normKey(gone.name);if(nk&&st.ignored.indexOf(nk)<0)st.ignored.push(nk)}
        state.subjects=state.subjects.filter(function(x){return x.id!==id});armedSub='';save();
      }
      else armedSub=id;
      render();
    }
    else if(act==='signin')signIn();
    else if(act==='reconnect')renewToken();
    else if(act==='signout')signOut();
    else if(act==='bk-now'){BK.failedDay='';driveBackup(true).then(render)}
    else if(act==='bk-list'){BK.msg='';BK.armed='';listBk().then(function(l){BK.list=l}).catch(function(e){BK.msg=friendly(e)}).then(render)}
    else if(act==='bk-restore'){if(BK.armed===id){BK.armed='';restoreBackup(id)}else{BK.armed=id;render()}}
    else if(act==='sync-now'){cloud.calError='';resetCal();loadCalendars();calSync().then(function(){render()})}
    else if(act==='refresh-cal'){resetCal();render()}
    else if(act==='import-subs'){cloud.importMsg='';importSubjects();render()}
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='hw-sub'){hwSub=t.value;render();return}
    if(t.id==='hw-sort'){hwSort=t.value;render();return}
    if(t.id==='f-sub'){refreshSlotSelect();return}
    if(t.id==='f-kind'){var we=document.getElementById('w-ech');if(we)we.hidden=(t.value==='cc'||t.value==='exam');return}
    if(t.id==='set-gcid'){state.settings.gClientId=t.value.trim();gis=null;save();render();return}
    if(t.getAttribute&&t.getAttribute('data-percal')!==null){
      state.settings.persoCals=[].slice.call(document.querySelectorAll('[data-percal]')).filter(function(x){return x.checked}).map(function(x){return x.getAttribute('data-percal')});
      persoCache={};persoFail={};savePerso();save();render();return;
    }
    if(t.id==='set-cal'){state.settings.schoolCal=t.value;state.settings.imported='';importTried='';cloud.importMsg='';resetCal();save();render();return}
    var sid=t.getAttribute&&t.getAttribute('data-sub');
    if(sid){
      var f=t.getAttribute('data-field');
      state.subjects.forEach(function(s){if(s.id===sid){s[f]=t.value.trim()}});
      save();
      if(f==='drive'||f==='name'||f==='color'||f==='ctype')render();
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closeModal();
    var tag=(e.target.tagName||'').toLowerCase();
    if((e.key==='n'||e.key==='N')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&tag!=='input'&&tag!=='textarea'&&tag!=='select'&&!document.getElementById('add-form')){e.preventDefault();openModal()}
  });
  window.addEventListener('hashchange',route);
  if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render)}catch(e){}
  route();
  cloudInit();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
